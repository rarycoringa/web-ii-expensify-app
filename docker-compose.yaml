version: '3.8'

services:
  expensify-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expensify-app
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - expensify-network

networks:
  expensify-network:
    external: true
